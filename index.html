<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css?family=Indie+Flower" rel="stylesheet">
<title>Feliz Día de la Novia Mi Loquilla</title>

   <!--



-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { 
    margin: 0; 
    height: 100%; 
    background: #000; 
    overflow: hidden; 
    font-family: "Indie Flower"; 
    touch-action: none;
  }
  canvas { display: block; }

  #white-flash {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, #ffffff 0%, #ffcccc 100%);
    z-index: 2500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s cubic-bezier(0.1, 0.9, 0.2, 1);
  }

  #start-screen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle at center, #3a0000 0%, #000000 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 3000;
    color: #ff4444;
    font-size: 2.2rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.5s ease;
    text-shadow: 0 0 20px #ff0000, 0 0 40px #ff5555;
    flex-direction: column;
    text-align: center;
    padding: 0 20px;
    box-sizing: border-box;
  }
  #start-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .pulse-text {
    animation: pulse 1.2s infinite alternate;
    letter-spacing: 1px;
  }
  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.08); opacity: 1; text-shadow: 0 0 30px #ff0000, 0 0 60px #ff5555; }
  }
  
  .start-heart {
    margin-top: 25px;
    width: 220px; 
    height: auto;
    animation: startHeartBeat 0.9s ease-in-out infinite;
  }
  @keyframes startHeartBeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  @media (max-width: 480px) {
    .start-heart { width: 100px; margin-top: 15px; }
  }

  #top-title {
    position: fixed;
    top: 12%;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 1500;
    pointer-events: none;
    font-family: "Indie Flower";
    font-weight: 800;
    font-size: 3.2rem;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ffffff, #ff6666, #ff0000, #ff6666, #ffffff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.9));
    animation: titlePulse 1.6s ease-in-out infinite, shine 3s linear infinite;
    opacity: 0;
    transition: opacity 3s ease;
  }
  @keyframes titlePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); filter: drop-shadow(0 0 30px rgba(255, 50, 50, 1)); }
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }
  @media (max-width: 480px) {
    #top-title { font-size: 2rem; top: 15% !important; }
  }
</style>
</head>
<body>

<div id="white-flash"></div>

<div id="start-screen">
  <div class="pulse-text">¡FELIZ DÍA DE LA NOVIA MI AMOR!</div>
  <img class="start-heart" src="fondo1.gif" alt="Iniciar"> 
</div>

<div id="top-title">¡FELIZ DÍA DE LA NOVIA LOQUILLA 😍!</div>

<canvas id="c"></canvas>

<audio id="audio" loop="" src="assets/sound.mp3" preload="auto"></audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>
<script>
const startScreen = document.getElementById('start-screen');
const flashScreen = document.getElementById('white-flash');
const topTitle = document.getElementById('top-title');
const audio = document.getElementById('audio');
audio.preload = 'auto';
audio.load();

let experienceStarted = false;
let extrasOpacity = 0;
let titleShown = false;

const customUniforms = {
  uTime: { value: 0.0 }
};

function unlockAudioAndStart() {
  if (experienceStarted) return;
  experienceStarted = true;
  
  const playPromise = audio.play();
  if (playPromise && typeof playPromise.catch === 'function') {
    playPromise.catch(err => console.log("Audio no autoplay:", err));
  }
  
  startScreen.classList.add('hidden');
  flashScreen.style.opacity = '1';
  setTimeout(() => {
    flashScreen.style.opacity = '0'; 
  }, 150);
}

startScreen.addEventListener('touchend', (e) => {
  e.preventDefault();
  unlockAudioAndStart();
}, {passive: false});
startScreen.addEventListener('click', unlockAudioAndStart);

const isMobile = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) || window.innerWidth <= 820;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias: !isMobile});
// Optimización clave para evitar LAG: Límite de Pixel Ratio
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.0 : 1.5));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 5000);

let targetDist = 400, currentDist = 400;
let rotX = 0.2; 
let rotY = 0;   

const loader = new THREE.TextureLoader();
const nebulaTex = loader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/cube/space/px.jpg');
scene.background = nebulaTex;

function makeDotTexture(){
  const size = 64;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0.0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.3, 'rgba(255,255,255,1)');
  grad.addColorStop(0.7, 'rgba(255,200,200,0.8)');
  grad.addColorStop(1.0, 'rgba(255,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
const dotTexture = makeDotTexture();

function addRandomAttribute(geom) {
  const count = geom.attributes.position.count;
  const randoms = new Float32Array(count);
  for(let i=0; i<count; i++) randoms[i] = Math.random();
  geom.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));
}

function setupParticleAnimation(material) {
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = customUniforms.uTime;
    shader.vertexShader = `
      uniform float uTime;
      attribute float aRandom;
    ` + shader.vertexShader;

    shader.vertexShader = shader.vertexShader.replace(
      `#include <begin_vertex>`,
      `
      vec3 transformed = vec3( position );
      vec3 startPos = vec3(0.0, 0.0, 0.0);
      
      float delay = aRandom * 0.15; 
      float progress = clamp(uTime - delay, 0.0, 2.5) / 2.5;
      
      float ease = 1.0 - pow(1.0 - progress, 5.0);
      
      float overshoot = sin(progress * 3.14159) * (60.0 + aRandom * 80.0);
      vec3 dir = normalize(position + vec3(0.001));
      
      vec3 targetPos = position + dir * (overshoot * (1.0 - progress));
      transformed = mix(startPos, targetPos, ease);
      `
    );

    shader.vertexShader = shader.vertexShader.replace(
      `gl_PointSize = size;`,
      `
      float flash = pow(1.0 - progress, 8.0) * 25.0 * aRandom;
      gl_PointSize = size * ease + flash;
      `
    );
  };
}

// Menos estrellas de fondo para más rendimiento
(function makeStars(count = isMobile ? 800 : 2000, spread=3000){
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for(let i=0; i<count; i++){
    const r = spread * (0.3 + Math.random() * 0.7);
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3+0] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.cos(ph);
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    size: 3.0, sizeAttenuation: false, map: dotTexture, transparent: true,
    alphaTest: 0.01, depthWrite: false, opacity: 0.8, color: 0xffdddd 
  })));
})();

function heartCurve(t){
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  return { x, y };
}

// --- CREACIÓN DEL CORAZÓN (MÁS PROTAGONISTA) ---
const HEART_SCALE = 3.5; const HEART_THICKNESS = 5.0; const HEART_DEPTH = 10.0; const HEART_Y_OFFSET = 6;
const heartPoints = [];
const HEART_COUNT = isMobile ? 3500 : 6000;
for (let i = 0; i < HEART_COUNT; i++) {
  const t = Math.random() * Math.PI * 2;
  const p0 = heartCurve(t);
  const p1 = heartCurve(t + 0.001);
  const tx = p1.x - p0.x, ty = p1.y - p0.y;
  const tLen = Math.hypot(tx, ty) || 1;
  const nx = -ty / tLen, ny = tx / tLen;
  const offset = (Math.random() - 0.5) * HEART_THICKNESS;
  heartPoints.push(new THREE.Vector3(
    (p0.x + nx * offset) * HEART_SCALE,
    (p0.y + ny * offset + HEART_Y_OFFSET) * HEART_SCALE,
    (Math.random() - 0.5) * HEART_DEPTH
  ));
}
const heartGeom = new THREE.BufferGeometry().setFromPoints(heartPoints);
addRandomAttribute(heartGeom); 
const heartMat = new THREE.PointsMaterial({
  color: 0xff1122, size: 4.5, map: dotTexture, transparent: true, // Color rojo puro y tamaño más grande
  alphaTest: 0.01, depthWrite: false, opacity: 1.0, blending: THREE.AdditiveBlending
});
setupParticleAnimation(heartMat); 
const heart = new THREE.Points(heartGeom, heartMat);
scene.add(heart);

// --- CREACIÓN DEL ESPIRAL ---
const spiralPoints = [];
const arms = 4;
const SPIRAL_COUNT = isMobile ? 1500 : 3500;
for (let i = 0; i < SPIRAL_COUNT; i++) {
  const r = Math.random() * 280; 
  const armIndex = Math.floor(Math.random() * arms);
  const theta = (armIndex * Math.PI * 2 / arms) + (r * 0.02) + (Math.random() * 0.4 - 0.2);
  spiralPoints.push(new THREE.Vector3(
    Math.cos(theta) * r,
    -35 - (r * 0.4) + (Math.random() * 8 - 4),
    Math.sin(theta) * r
  ));
}
const spiralGeom = new THREE.BufferGeometry().setFromPoints(spiralPoints);
addRandomAttribute(spiralGeom); 
const spiralMat = new THREE.PointsMaterial({
  color: 0xff4444, size: 2.4, map: dotTexture, transparent: true, 
  alphaTest: 0.01, depthWrite: false, opacity: 0.9, blending: THREE.AdditiveBlending
});
setupParticleAnimation(spiralMat); 
const spiral = new THREE.Points(spiralGeom, spiralMat);
scene.add(spiral);

// --- CREACIÓN DEL POLVO (Reducido drásticamente para evitar Lag) ---
const DUST_INNER_R = 150; const DUST_OUTER_R = 400;
const dustPoints = [];
const DUST_COUNT = isMobile ? 2500 : 5000;
for (let i = 0; i < DUST_COUNT; i++) {
  const r = DUST_INNER_R + Math.random() * (DUST_OUTER_R - DUST_INNER_R);
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  dustPoints.push(new THREE.Vector3(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.sin(theta)
  ));
}
const dustGeom = new THREE.BufferGeometry().setFromPoints(dustPoints);
addRandomAttribute(dustGeom); 
const dustMat = new THREE.PointsMaterial({
  color: 0xff7777, size: 1.8, map: dotTexture, transparent: true, 
  alphaTest: 0.01, depthWrite: false, opacity: 0.6, blending: THREE.AdditiveBlending
});
setupParticleAnimation(dustMat); 
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

// --- NÚCLEO GALÁCTICO BRILLANTE (Más tenue para destacar el corazón) ---
function makeGlow(size=1024, c1='255,100,100', c2='255,50,50'){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size/2, size/2, size*0.02, size/2, size/2, size*0.5);
  // Reducimos la intensidad blanca del centro
  grad.addColorStop(0, 'rgba(255,200,200,0.6)'); 
  grad.addColorStop(0.15, 'rgba(' + c1 + ',0.4)'); 
  grad.addColorStop(0.4, 'rgba(' + c2 + ',0.15)'); 
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, size, size); return new THREE.CanvasTexture(c);
}
const glowMaterial = new THREE.SpriteMaterial({map: makeGlow(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending});
const glow = new THREE.Sprite(glowMaterial);
glow.scale.set(0, 0, 1); 
scene.add(glow);

function ringTexture(size=1024){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.translate(size/2, size/2);
  const r1 = size*0.35, r2 = size*0.48;
  const grd = g.createRadialGradient(0, 0, r1*0.6, 0, 0, r2);
  grd.addColorStop(0.0, 'rgba(255,150,150,1)'); grd.addColorStop(0.3, 'rgba(255,50,50,0.8)');
  grd.addColorStop(0.7, 'rgba(200,0,0,0.5)'); grd.addColorStop(1.0, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(0,0,r2,0,Math.PI*2); g.arc(0,0,r1,0,Math.PI*2,true); g.closePath(); g.fill();
  return new THREE.CanvasTexture(c);
}
const ring1 = new THREE.Mesh(new THREE.RingGeometry(80, 115, 128), new THREE.MeshBasicMaterial({map: ringTexture(), transparent: true, side: THREE.DoubleSide, opacity: 0.6, blending: THREE.AdditiveBlending}));
const ring2 = new THREE.Mesh(new THREE.RingGeometry(125, 155, 128), new THREE.MeshBasicMaterial({map: ringTexture(), transparent: true, side: THREE.DoubleSide, opacity: 0.4, blending: THREE.AdditiveBlending}));
ring1.rotation.x = ring2.rotation.x = Math.PI/2;
ring1.scale.set(0,0,0); 
ring2.scale.set(0,0,0);
scene.add(ring1); scene.add(ring2);

const WORDS = [];
const baseWords = [
  'Feliz Día de la Novia 💖', 'Te Amo Mi Loquilla 🌟', 'Eres mi Mundo ✨',
  'Mi Princesa 👑', 'TE AMO Y MAS 💑', 'Me Encantas',
  'Preciosa mamasita', 'Hermosa 🌹', 'Dueña de mi Corazón ❤️',
  'Mi Amor Anhelado', 'Amor de mi Vida'
];

const PHRASE_REPEAT = isMobile ? 2 : 4; // Menos repeticiones para mejor rendimiento
for(let i=0; i<PHRASE_REPEAT; i++){ WORDS.push(...baseWords); }

function makeTextTexture(text, color){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 128;
  const ctx = c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let fontSize = 55; ctx.font = `800 ${fontSize}px "Playfair Display", serif`;
  while (ctx.measureText(text).width > c.width - 50 && fontSize > 26) { fontSize -= 2; ctx.font = `800 ${fontSize}px "Playfair Display", serif`; }
  
  ctx.fillStyle = '#ffffff'; 
  ctx.shadowColor = color; 
  ctx.shadowBlur = 30; 
  ctx.fillText(text, c.width/2, c.height/2);
  ctx.shadowBlur = 10; 
  ctx.fillText(text, c.width/2, c.height/2);

  return new THREE.CanvasTexture(c);
}
const COLORS = ['#ff5555','#ff3333','#ff0000','#ff6666','#ff7777','#ff1a1a'];
const textGroup = new THREE.Group(); scene.add(textGroup);

document.fonts.ready.then(() => {
  for(let i=0; i<WORDS.length; i++){
    const tex = makeTextTexture(WORDS[i], COLORS[i%COLORS.length]);
    const mat = new THREE.SpriteMaterial({map: tex, transparent: true, opacity: 0}); 
    const sp = new THREE.Sprite(mat);
    sp.scale.set(110, 13.75, 1);
    const phi = Math.acos(2 * Math.random() - 1); const theta = Math.random() * Math.PI * 2;
    const r = DUST_INNER_R + Math.random() * (DUST_OUTER_R - DUST_INNER_R - 30);
    
    // Cálculo optimizado para evitar matemáticas complejas repetitivas en cada frame
    sp.position.y = r * Math.cos(phi);
    sp.userData = { radiusSinPhi: r * Math.sin(phi), theta: theta, speed: 0.001 + Math.random() * 0.001 };
    
    textGroup.add(sp);
  }
});


const misImagenes = [
  'scar.png', 'scar2.png', 'scar3.png', 'scar4.png', 'scar5.png', 'scar6.jpg',
  'scar.png', 'scar2.png', 'scar3.png', 'scar4.png', 'scar5.png', 'scar6.jpg',
  'scar.png', 'scar2.png', 'scar3.png', 'scar4.png', 'scar5.png', 'scar6.jpg',
  
];

const imageGroup = new THREE.Group(); 
scene.add(imageGroup);
const texLoader = new THREE.TextureLoader();

misImagenes.forEach((url) => {
  texLoader.load(url, (texture) => {
    const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0 }); 
    const sp = new THREE.Sprite(mat);
    sp.scale.set(40, 40, 1);
    const phi = Math.acos(2 * Math.random() - 1); const theta = Math.random() * Math.PI * 2;
    const r = DUST_INNER_R + Math.random() * (DUST_OUTER_R - DUST_INNER_R);
    
    sp.position.y = r * Math.cos(phi);
    sp.userData = { radiusSinPhi: r * Math.sin(phi), theta: theta, speed: 0.001 + Math.random() * 0.0015 };
    
    imageGroup.add(sp);
  }, undefined, (err) => console.log('Falta añadir la imagen: ' + url));
});

let isPointerDown = false;
let startX = 0, startY = 0;
let targetRotX = 0.2, targetRotY = 0;
let velX = 0, velY = 0;

function onDown(e) { isPointerDown = true; velX = 0; velY = 0; const t = e.touches ? e.touches[0] : e; startX = t.clientX; startY = t.clientY; }
function onMove(e) {
  if (!isPointerDown) return;
  if (e.touches && e.touches.length > 1) return; 
  const t = e.touches ? e.touches[0] : e; const dx = t.clientX - startX; const dy = t.clientY - startY;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
    const sensX = (Math.PI * 1.5) / innerWidth; const sensY = (Math.PI * 0.8) / innerHeight;
    velY = -dx * sensX; velX = dy * sensY; targetRotY += velY; targetRotX = Math.max(-1.25, Math.min(1.25, targetRotX + velX));
    startX = t.clientX; startY = t.clientY;
  }
}
function onUp() { isPointerDown = false; }

const dom = renderer.domElement;
dom.addEventListener('mousedown', onDown); dom.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
dom.addEventListener('touchstart', onDown, {passive: true}); dom.addEventListener('touchmove', onMove, {passive: true});
window.addEventListener('touchend', (e) => {
  if (!e.touches || e.touches.length === 0) { onUp(); } else { const t = e.touches[0]; startX = t.clientX; startY = t.clientY; }
}, {passive: true});

addEventListener('wheel', (e) => {
  targetDist += e.deltaY * 0.25; targetDist = Math.max(180, Math.min(1100, targetDist));
}, {passive: true});

let pinchDist = null; 
function getPinchDist(touches) { const dx = touches[0].clientX - touches[1].clientX; const dy = touches[0].clientY - touches[1].clientY; return Math.hypot(dx, dy); }

addEventListener('touchstart', (e) => { if (e.touches.length === 2) { pinchDist = getPinchDist(e.touches); isPointerDown = false; } }, {passive: true});
addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const newDist = getPinchDist(e.touches);
    if (pinchDist !== null) { const delta = pinchDist - newDist; targetDist += delta * 0.85; targetDist = Math.max(180, Math.min(1100, targetDist)); }
    pinchDist = newDist;
  } else { if (pinchDist !== null) { pinchDist = null; if (e.touches.length === 1) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; isPointerDown = true; } } }
}, {passive: true});
addEventListener('touchend', (e) => { if (e.touches.length < 2) { pinchDist = null; } }, {passive: true});

let t = 0;
const INERTIA_DECAY = 0.88; 

function tick(){
  requestAnimationFrame(tick);
  t += 0.01;

  if (experienceStarted) {
    customUniforms.uTime.value += 0.025; 
  }

  if (!isPointerDown) {
    velX *= INERTIA_DECAY; velY *= INERTIA_DECAY;
    targetRotX = Math.max(-1.25, Math.min(1.25, targetRotX + velX)); targetRotY += velY;
  }

  rotX += (targetRotX - rotX) * 0.12;
  rotY += (targetRotY - rotY) * 0.12;

  ring1.rotation.z += 0.002; ring2.rotation.z -= 0.0015;
  spiral.rotation.y -= 0.0045; dust.rotation.y += 0.0006;

  let globalEase = Math.min(1.0, customUniforms.uTime.value / 4.0);
  let smoothGlobal = 1.0 - Math.pow(1.0 - globalEase, 3.0); 

  // Luz central más pequeña para que destaque el corazón
  let glowScale = 300 * smoothGlobal * (1 + Math.sin(t*0.5)*0.05);
  glow.scale.set(glowScale, glowScale, 1);
  ring1.scale.set(smoothGlobal, smoothGlobal, smoothGlobal);
  ring2.scale.set(smoothGlobal, smoothGlobal, smoothGlobal);

  // Latido del corazón más pronunciado
  const s = 1.0 + 0.08 * Math.sin(t * 5);
  heart.scale.set(s, s, s);

  if (customUniforms.uTime.value > 4.5) {
    if (extrasOpacity < 1) {
      extrasOpacity += 0.008; 
    }
    if (!titleShown) {
      topTitle.style.opacity = 1;
      titleShown = true;
    }
  }

  // Animaciones optimizadas de Sprites
  textGroup.children.forEach(sp => {
    sp.material.opacity = (0.9 + 0.1 * Math.sin(t * 2)) * extrasOpacity;
    sp.userData.theta += sp.userData.speed;
    sp.position.x = sp.userData.radiusSinPhi * Math.cos(sp.userData.theta);
    sp.position.z = sp.userData.radiusSinPhi * Math.sin(sp.userData.theta);
  });

  imageGroup.children.forEach(sp => {
    sp.material.opacity = (0.9 + 0.1 * Math.sin(t * 1.5)) * extrasOpacity;
    sp.userData.theta += sp.userData.speed;
    sp.position.x = sp.userData.radiusSinPhi * Math.cos(sp.userData.theta);
    sp.position.z = sp.userData.radiusSinPhi * Math.sin(sp.userData.theta);
  });

  currentDist += (targetDist - currentDist) * 0.06;

  const camX = currentDist * Math.cos(rotX) * Math.sin(rotY);
  const camY = currentDist * Math.sin(rotX);
  const camZ = currentDist * Math.cos(rotX) * Math.cos(rotY);
  camera.position.set(camX, camY, camZ);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
tick();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
